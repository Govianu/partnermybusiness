<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open your dashboard | Partnermybusiness.ai</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="top"><a href="/">Partnermybusiness<span>.ai</span></a></header>
<main class="wrap" style="max-width:520px">
  <p class="muted" id="loading">Checking your link…</p>

  <section class="card" id="setPane" hidden>
    <h1 id="hello">Welcome</h1>
    <p class="muted" id="intro">Set a password to open your dashboard.</p>
    <form id="setForm" novalidate>
      <p class="err" id="setErr" role="alert"></p>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" readonly></div>
      <div class="field"><label for="pw">Password <span class="muted" style="font-weight:400">(at least 8 characters)</span></label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="pw2">Type it again</label><input id="pw2" type="password" autocomplete="new-password" required></div>
      <button class="btn wide" type="submit" id="setBtn">Open my dashboard</button>
    </form>
  </section>

  <section class="card" id="badPane" hidden>
    <h1>This link has expired</h1>
    <p class="muted">Links work once and last 72 hours. Enter your email and we’ll send a fresh one.</p>
    <form id="newForm" novalidate>
      <p class="err" id="newErr" role="alert"></p>
      <p class="ok" id="newOk" role="status"></p>
      <div class="field"><label for="newEmail">Email</label><input id="newEmail" type="email" autocomplete="email" required></div>
      <button class="btn wide" type="submit">Send me a new link</button>
    </form>
    <p style="margin-top:1rem"><a href="/login.html#login">Back to login</a></p>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('token') || '';
  function call(url, opts) {
    return fetch(url, opts).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.httpOk = r.ok; return j; }); });
  }
  function show(id) { $('loading').hidden = true; $('setPane').hidden = id !== 'set'; $('badPane').hidden = id !== 'bad'; }

  call('/api/auth/link/' + encodeURIComponent(token)).then(function (r) {
    if (!r.httpOk) return show('bad');
    var first = String(r.name || '').split(' ')[0];
    $('hello').textContent = first ? 'Welcome, ' + first : 'Welcome';
    $('intro').textContent = r.purpose === 'reset' ? 'Choose a new password for your dashboard.' : 'Set a password to open your dashboard. You’ll use it with this email to log in next time.';
    $('setBtn').textContent = r.purpose === 'reset' ? 'Save and open my dashboard' : 'Open my dashboard';
    $('email').value = r.email || '';
    show('set');
    $('pw').focus();
  }).catch(function () { show('bad'); });

  $('setForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value, err = $('setErr');
    err.textContent = '';
    if (pw.length < 8) { err.textContent = 'Use a password with at least 8 characters.'; return $('pw').focus(); }
    if (pw !== $('pw2').value) { err.textContent = 'The two passwords don’t match.'; return $('pw2').focus(); }
    $('setBtn').disabled = true;
    call('/api/auth/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: pw }) })
      .then(function (r) {
        if (r.httpOk) { location.href = r.redirect; return; }
        $('setBtn').disabled = false;
        if (r.error && /expired|used/.test(r.error)) return show('bad');
        err.textContent = r.error || 'Something went wrong. Try again.';
      }).catch(function () { $('setBtn').disabled = false; err.textContent = 'Couldn’t reach the server. Try again.'; });
  });

  $('newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('newEmail').value.trim();
    $('newErr').textContent = ''; $('newOk').textContent = '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('newErr').textContent = 'Enter the email you used for your enquiry.'; return; }
    call('/api/auth/request-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) })
      .then(function (r) {
        if (!r.httpOk) { $('newErr').textContent = r.error || 'Couldn’t send right now.'; return; }
        $('newOk').textContent = 'If that email has a dashboard, a new link is on its way.';
        if (r.devLink) { var a = document.createElement('a'); a.href = r.devLink; a.textContent = ' Test mode: open the link'; $('newOk').appendChild(a); }
      });
  });
})();
</script>
</body>
</html>
