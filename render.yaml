# FREE test setup on Render: Dashboard > New > Blueprint > pick this repository.
# Free plan limits (fine for testing, not for real customers):
#  - Email ports are blocked, so email goes through the Brevo API (BREVO_API_KEY), not Zoho SMTP.
#  - No disk: accounts, listings and bookings are wiped whenever the service restarts, redeploys or wakes from sleep.
#  - The service sleeps after about 15 minutes without visitors; the first visit after that takes up to a minute.
# For the real launch use render-paid.yaml.example (Starter + disk).
services:
  - type: web
    name: partnermybusiness-test
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Partnermybusiness.ai <info@partnermybusiness.ai>
      - key: TEAM_INBOX
        value: info@partnermybusiness.ai
      - key: HEYGEN_TEST_MODE
        value: "true"
