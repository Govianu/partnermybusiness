services:
  - type: web
    name: partnermybusiness-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: partnermybusiness-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TEAM_INBOX
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_AVATAR_ID
        sync: false
      - key: HEYGEN_VOICE_ID
        sync: false
      - key: HEYGEN_TEST_MODE
        value: "true"
      - key: HEYGEN_MONTHLY_MINUTES
        value: "60"
