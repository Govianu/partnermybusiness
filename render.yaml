services:
  - type: web
    name: partnermybusiness-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TEAM_INBOX
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_AVATAR_ID
        sync: false
      - key: HEYGEN_VOICE_ID
        sync: false
      - key: HEYGEN_TEST_MODE
        value: "true"
      - key: HEYGEN_MONTHLY_MINUTES
        value: "60"
